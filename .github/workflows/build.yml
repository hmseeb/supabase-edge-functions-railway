name: Build wrapper images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ripgrep
      - name: Run contracts
        run: |
          chmod +x test/*.sh test/*.py boot/*.sh images/*/*.sh
          test/all.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: db
            dockerfile: images/db/Dockerfile
          - name: gateway
            dockerfile: images/gateway/Dockerfile
          - name: functions
            dockerfile: images/functions/Dockerfile
          - name: pooler
            dockerfile: images/pooler/Dockerfile
          - name: storage
            dockerfile: images/storage/Dockerfile
          - name: studio
            dockerfile: images/studio/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/supabase-railway-${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
